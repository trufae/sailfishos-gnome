name: Packages
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['rpm/**', 'scripts/**', 'vapi/**', 'tests/**', 'sources.lock', '.github/workflows/packages.yml']
  pull_request:
    paths: ['rpm/**', 'scripts/**', 'vapi/**', 'tests/**', 'sources.lock', '.github/workflows/packages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch pinned sources
        run: scripts/fetch-sources.sh
      - name: Pull Sailfish SDK
        id: sdk
        run: |
          docker pull coderus/sailfishos-platform-sdk-aarch64:5.1.0.11
          echo "image=$(docker image inspect --format '{{.Id}}' coderus/sailfishos-platform-sdk-aarch64:5.1.0.11)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .cache/ccache
          key: sfos-ccache-v1-aarch64-5.1.0.11-${{ steps.sdk.outputs.image }}-${{ github.sha }}
          restore-keys: sfos-ccache-v1-aarch64-5.1.0.11-${{ steps.sdk.outputs.image }}-
      - name: Build runtime and development RPMs
        env:
          SFOS_IMAGE: ${{ steps.sdk.outputs.image }}
        run: scripts/build-rpm.sh
      - name: Collect binaries, sources and checksums
        env:
          SFOS_IMAGE: ${{ steps.sdk.outputs.image }}
        run: python3 scripts/make-release.py
      - uses: actions/upload-artifact@v7
        with:
          name: sailfish-gnome-5.1.0.11-aarch64
          path: out/*
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: package-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: sailfish-gnome-5.1.0.11-aarch64
          path: out
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          version=$(awk '/^Version:/ {print $2}' rpm/sailfish-gnome.spec)
          RELEASE_TAG="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$REF_NAME" = "$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; bump Version for a new release."
            exit 0
          fi
          (cd out && sha256sum -c SHA256SUMS)
          gh release create "$RELEASE_TAG" out/* --target "$COMMIT_SHA" \
            --title "Sailfish GNOME $version · Sailfish OS 5.1.0.11 / aarch64" \
            --notes-file RELEASE-NOTES.md
